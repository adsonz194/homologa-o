{% extends 'base.html' %}
{% block title %}{{ titulo }} | Delivery{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4 text-center">
        <div class="spinner-border text-primary mb-3" role="status"><span class="visually-hidden">Carregando</span></div>
        <h1 class="h4">{{ titulo }}</h1>
        <p class="text-muted">{{ descricao }}</p>
        <form id="form-pagamento" method="post" action="{{ destino }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          {% if autorizacao_pagamento %}<input type="hidden" name="autorizacao_pagamento" value="{{ autorizacao_pagamento }}">{% endif %}
          <button class="btn btn-primary">Continuar para pagamento</button>
        </form>
        <p class="small text-muted mt-3 mb-0">Se o redirecionamento n\u00e3o iniciar, use o bot\u00e3o acima.</p>
      </div>
    </div>
  </div>
</div>
<script>
  {% if auto_submit %}
    window.addEventListener('load', () => document.getElementById('form-pagamento').requestSubmit());
  {% endif %}
</script>
{% endblock %}

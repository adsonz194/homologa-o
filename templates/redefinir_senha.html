{% extends 'base.html' %}
{% block title %}Redefinir senha | AG Delivery{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm"><div class="card-body">
  <div class="auth-symbol">&#128273;</div><h1 class="h3 fw-bold mb-1">Criar nova senha</h1>
  <p class="text-muted mb-4">Digite o codigo recebido por e-mail e escolha uma nova senha para o painel.</p>
  <form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="col-12"><label class="form-label" for="identificador">Usuario ou e-mail</label><input class="form-control" id="identificador" name="identificador" value="{{ identificador }}" autocomplete="username" maxlength="254" required></div>
    <div class="col-12"><label class="form-label" for="codigo">Codigo de 6 digitos</label><input class="form-control" id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
    <div class="col-12"><label class="form-label" for="senha">Nova senha</label><input class="form-control" id="senha" type="password" name="senha" autocomplete="new-password" minlength="12" required><div class="form-text">Use pelo menos 12 caracteres.</div></div>
    <div class="col-12"><label class="form-label" for="confirmacao_senha">Repita a nova senha</label><input class="form-control" id="confirmacao_senha" type="password" name="confirmacao_senha" autocomplete="new-password" minlength="12" required></div>
    <div class="col-12"><button class="btn btn-primary w-100">Alterar senha</button></div>
  </form>
  <p class="mt-3 mb-0"><a class="small" href="{{ url_for('auth.recuperar_senha') }}">Pedir outro codigo</a></p>
</div></div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Erro {{ codigo }} | Delivery{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <p class="display-6 text-muted">{{ codigo }}</p>
        <h1 class="h4">Nao foi possivel concluir esta acao</h1>
        <p class="text-muted mb-4">{{ mensagem }}</p>
        <a class="btn btn-primary" href="{{ url_for('cliente.loja') }}">Ir para o delivery</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Entrar no painel{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm"><div class="card-body"><div class="auth-symbol">&#128274;</div><h1 class="h3 fw-bold mb-1">Painel interno</h1><p class="text-muted mb-4">Acesso exclusivo para dono e funcionarios.</p><form method="post" class="row g-3"><input type="hidden" name="proximo" value="{{ proximo }}"><div class="col-12"><label class="form-label">Usuario</label><input class="form-control" name="usuario" autocomplete="username" required autofocus></div><div class="col-12"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" autocomplete="current-password" required></div><div class="col-12"><button class="btn btn-primary w-100">Entrar no painel</button></div></form></div></div>
{% endblock %}

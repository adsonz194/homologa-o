{% extends 'base.html' %}
{% block title %}Acompanhar pedido | Delivery{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3">Acompanhar pedido</h1>
        <p class="text-muted">Informe o codigo que recebeu ao concluir o pagamento.</p>
        <form method="post" class="d-grid gap-3">
          <div>
            <label class="form-label" for="codigo_acompanhamento">Codigo de acompanhamento</label>
            <input class="form-control form-control-lg text-uppercase" id="codigo_acompanhamento" name="codigo_acompanhamento" autocomplete="off" placeholder="Ex.: MDS-12AB34CD56EF78AB" required autofocus>
          </div>
          <button class="btn btn-primary">Acompanhar pedido</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
